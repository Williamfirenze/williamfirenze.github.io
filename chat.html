<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask William — knowledge base assistant</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private knowledge base assistant. Access code required.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0b0c'/><text x='50' y='70' font-size='56' font-family='monospace' font-weight='700' fill='%23fff' text-anchor='middle'>W</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="page">

  <header class="bar">
    <div class="bar__in">
      <a class="bar__back" href="index.html">
        <span class="mark">WF</span>
      </a>
      <div class="bar__t">
        <b>Ask William</b>
        <span id="barSub">knowledge base assistant</span>
      </div>
      <div class="bar__r">
        <span class="tag" id="who" hidden></span>
        <span class="tag" id="kbTag">…</span>
        <button class="mini" id="btnOut" hidden>EXIT</button>
      </div>
    </div>
  </header>

  <!-- ============ ACCESS GATE ============ -->
  <section class="gate" id="gate">
    <div class="gate__box">
      <h1>Access code</h1>
      <p>This assistant answers from William's private runbooks. Ask him for a code if you don't have one.</p>
      <form class="field" id="codeForm" autocomplete="off">
        <input id="codeInput" placeholder="your code" aria-label="Access code" maxlength="24" required>
        <button class="btn2 btn2--solid" type="submit">ENTER</button>
      </form>
      <p class="note" id="gateMsg"></p>
    </div>
  </section>

  <!-- ============ CHAT ============ -->
  <section class="chat" id="chat" hidden>
    <div class="chat__scroll" id="scroll">
      <div class="chat__in" id="stream"></div>
    </div>
    <div class="composer">
      <form class="composer__in" id="sendForm">
        <textarea id="input" rows="1" placeholder="Describe the error, paste an ORA- code, or ask how to do something…" aria-label="Message"></textarea>
        <button class="send" type="submit" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <p class="composer__hint">Answers come from William's knowledge base — not from a language model. Nothing you type leaves your browser.</p>
    </div>
  </section>

</div>

<script src="assets/js/kb-engine.js" defer></script>
<script src="assets/js/chat.js" defer></script>
</body>
</html>
